<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A50"/>
      <stop offset="100%" stop-color="#FF6A3D"/>
    </linearGradient>
  </defs>

  <!-- App-icon canvas, same rounded-square proportions as an Android adaptive icon -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#2A2A2E" stroke-width="3"/>

  <!-- Barbell mark - a bigger outer plate plus a smaller inner plate per side.
       Scaled down 0.72x about the canvas center so it sits well clear of the
       rounded corners and (for the adaptive-icon foreground) the launcher's
       mask/zoom safe zone, instead of nearly touching the edges. -->
  <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <!-- bar -->
    <rect x="176" y="246" width="160" height="20" rx="10" fill="url(#barGrad)"/>

    <!-- left plates -->
    <rect x="118" y="188" width="30" height="136" rx="9" fill="#FF6A3D"/>
    <rect x="152" y="212" width="20" height="88" rx="7" fill="#FF6A3D" opacity="0.55"/>

    <!-- right plates -->
    <rect x="364" y="188" width="30" height="136" rx="9" fill="#FF6A3D"/>
    <rect x="340" y="212" width="20" height="88" rx="7" fill="#FF6A3D" opacity="0.55"/>
  </g>
</svg>
