<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A50"/>
      <stop offset="100%" stop-color="#FF6A3D"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="680" height="200" fill="url(#bg2)"/>

  <!-- icon mark, scaled down and left-aligned -->
  <g transform="translate(40, 24) scale(0.29)">
    <rect x="172" y="246" width="168" height="20" rx="10" fill="url(#barGrad2)"/>
    <rect x="110" y="174" width="38" height="164" rx="13" fill="#FF6A3D"/>
    <rect x="364" y="174" width="38" height="164" rx="13" fill="#FF6A3D"/>
  </g>

  <!-- wordmark -->
  <text x="185" y="118" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700"
        letter-spacing="2" fill="#F5F5F7">WORKOUT<tspan fill="#FF6A3D">LOG</tspan></text>

  <!-- accent dot + tagline, echoing the "ATHLETE RECORD ●" bullet motif used in the app -->
  <circle cx="192" cy="142" r="5" fill="#FF6A3D"/>
  <text x="206" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4"
        fill="#6E6E74">TRAIN. LOG. REPEAT.</text>
</svg>
